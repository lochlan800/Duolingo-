<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duolingo Snake Buttons</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <p class="section-label">Section 1 Unit 1 - Rookie</p>
            <h1>🦉 Duolingo</h1>
            <p>Complete the lesson</p>
        </header>

        <div class="game-area">
            <div class="buttons-grid" id="buttonsGrid"></div>
        </div>

        <div class="progress">
            <p id="progress">Progress: 0/10</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <button class="reset-btn" onclick="resetGame()">Reset Game</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
