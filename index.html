<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duolingo - Spanish Greetings</title>
    <link rel="stylesheet" href="style.css?v=22">
</head>
<body>
    <div class="container">
        <header>
            <p class="section-label">Section 1 Unit 1 - Rookie</p>
            <h1>🇪🇸 Spanish Greetings</h1>
            <p>Tap a button to start a lesson</p>
        </header>

        <div class="game-area">
            <div class="snake-path" id="snakePath"></div>
        </div>

        <div class="progress">
            <p id="progress">Progress: 0/10</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <button class="reset-btn" onclick="resetGame()">Reset Game</button>
    </div>

    <!-- Question Modal (hidden by default) -->
    <div class="modal" id="questionModal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="questionTitle">Question</h2>
                <button class="close-btn" onclick="closeQuestion()">&times;</button>
            </div>
            <div class="modal-body">
                <p id="questionText" class="question-text"></p>

                <!-- Recording UI for speech questions -->
                <div id="recordingContainer" style="display:none;">
                    <p id="pronunciationPrompt" class="pronunciation-prompt"></p>
                    <p id="englishHint" class="english-hint"></p>

                    <div class="recording-controls">
                        <button id="recordBtn" class="record-btn" onclick="startRecording()">🎤 Record</button>
                        <button id="stopBtn" class="stop-btn" style="display:none;" onclick="stopRecording()">⏹ Stop</button>
                    </div>

                    <canvas id="frequencyCanvas" class="frequency-canvas" width="300" height="100"></canvas>
                    <p id="frequencyLabel" class="frequency-label">Ready to record...</p>

                    <audio id="recordingPlayback" class="recording-playback" controls></audio>
                </div>

                <!-- Multiple choice answers -->
                <div id="answersContainer" class="answers-container"></div>
                <p id="feedback" class="feedback"></p>
            </div>
            <div class="modal-footer">
                <button class="submit-btn" onclick="checkAnswer()">Submit Answer</button>
            </div>
        </div>
    </div>

    <script src="script.js?v=16"></script>
</body>
</html>
