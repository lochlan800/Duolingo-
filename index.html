<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duolingo Snake Buttons</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <p class="section-label">Section 1 Unit 1 - Rookie</p>
            <h1>🇪🇸 Spanish Greetings</h1>
            <p>Learn how to greet people in Spanish</p>
        </header>

        <div class="game-area">
            <div class="buttons-grid" id="buttonsGrid"></div>
        </div>

        <div class="progress">
            <p id="progress">Progress: 0/10</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <button class="reset-btn" onclick="resetGame()">Reset Game</button>
    </div>

    <!-- Question Modal -->
    <div class="modal" id="questionModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="questionTitle">Question</h2>
                <button class="close-btn" onclick="closeQuestion()">&times;</button>
            </div>
            <div class="modal-body">
                <p id="questionText" class="question-text"></p>
                <div id="answersContainer" class="answers-container"></div>
                <p id="feedback" class="feedback"></p>
            </div>
            <div class="modal-footer">
                <button class="submit-btn" onclick="checkAnswer()">Submit Answer</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
