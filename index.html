<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duolingo - Spanish Greetings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">

        <header class="top-bar">
            <div class="unit-badge">
                <span class="flag">🇪🇸</span>
                <div>
                    <p class="unit-label">Section 1 · Unit 1</p>
                    <p class="unit-name">Rookie · Spanish Greetings</p>
                </div>
            </div>
            <div class="hearts">❤️ ❤️ ❤️</div>
        </header>

        <div class="progress-bar-wrap">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <main class="snake-wrap">
            <div class="snake-path" id="snakePath"></div>
        </main>

        <button class="reset-btn" onclick="resetGame()">↺ Restart Lesson</button>
    </div>

    <!-- Question Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <div class="modal-top">
                <span class="question-num" id="questionNum">1 / 10</span>
                <button class="x-btn" onclick="closeModal()">✕</button>
            </div>
            <p class="question-prompt" id="questionPrompt"></p>
            <div class="choices" id="choices"></div>
            <p class="feedback" id="feedback"></p>
            <button class="check-btn" id="checkBtn" onclick="checkAnswer()">Check Answer</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
